[package]
name = "no-clue"
version = "0.1.0"
description = "A Tauri App - AI Assistant with Overlay"
authors = ["theandru"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
tokio-stream = "0.1"
async-channel = "2"
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1.89"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "native-tls"] }
base64 = "0.22"
anyhow = "1"
tokio-util = "0.7.19"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_Foundation"] }
wasapi = "0.22"
